<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammy's Country Apple Pie — A D&amp;D Adventure</title>
<style>
/* =========================================================
   Grammy's Country Apple Pie — cozy storybook D&D theme
   ========================================================= */

:root{
  --ink:#3a2418;
  --ink-soft:#6b4b34;
  --parchment:#f6ead2;
  --parchment-2:#f0dfc0;
  --parchment-3:#e7d1a9;
  --crust:#c9873f;
  --crust-dark:#8a5322;
  --apple:#b3352b;
  --apple-dark:#7d1f18;
  --leaf:#5f7a3a;
  --leaf-dark:#3f5526;
  --gold:#d9a441;
  --shadow:rgba(58,36,24,.22);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box}

html,body{margin:0;padding:0}

body{
  font-family:var(--serif);
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(255,222,164,.55), transparent 60%),
    radial-gradient(900px 600px at 105% 8%, rgba(191,66,52,.16), transparent 55%),
    radial-gradient(900px 700px at 50% 115%, rgba(95,122,58,.22), transparent 60%),
    linear-gradient(168deg,#3f2a1a 0%, #54371f 42%, #3a2617 100%);
  background-attachment:fixed;
}

/* faint falling leaves, pure CSS */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.04) 0 2px, transparent 3px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,.05) 0 1px, transparent 2px);
  background-size:220px 220px,300px 300px,180px 180px;
  opacity:.7;
}

#app{
  position:relative; z-index:1;
  display:grid;
  grid-template-columns:minmax(0,1fr) 322px;
  gap:22px;
  max-width:1240px;
  margin:0 auto;
  padding:16px 20px;
  align-items:stretch;
  height:100vh; height:100dvh;
  box-sizing:border-box;
}

/* ---------------- main column ---------------- */
#main{min-width:0;display:flex;flex-direction:column;gap:16px;height:100%;min-height:0}

/* The parchment frame stays fixed; only the text inside scrolls. */
.story-frame{
  position:relative;
  flex:1; min-height:0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 26%),
    repeating-linear-gradient(93deg, rgba(139,94,52,.045) 0 3px, transparent 3px 7px),
    linear-gradient(160deg, var(--parchment) 0%, var(--parchment-2) 60%, var(--parchment-3) 100%);
  border:1px solid rgba(138,83,34,.4);
  border-radius:14px;
  box-shadow:0 22px 46px -18px var(--shadow), inset 0 0 0 6px rgba(255,255,255,.22), inset 0 0 60px rgba(138,83,34,.10);
  overflow:hidden;
}
.story-frame::after{
  content:""; position:absolute; inset:8px; border:1px solid rgba(138,83,34,.22);
  border-radius:8px; pointer-events:none;
}
.story{
  height:100%;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:30px 32px 26px;
  scrollbar-width:thin;
  scrollbar-color:rgba(138,83,34,.45) transparent;
}
.story::-webkit-scrollbar{width:10px}
.story::-webkit-scrollbar-thumb{background:rgba(138,83,34,.35);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.story::-webkit-scrollbar-track{background:transparent}

/* ---------------- headings ---------------- */
.chapter{
  font-family:var(--sans);
  text-transform:uppercase; letter-spacing:.22em; font-size:.66rem; font-weight:700;
  color:var(--crust-dark); opacity:.85; margin:0 0 6px;
}
h1{
  font-size:clamp(1.7rem,4.4vw,2.5rem);
  line-height:1.12; margin:0 0 4px;
  color:var(--apple-dark);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
h1 .accent{color:var(--leaf-dark)}
.subtitle{font-style:italic;color:var(--ink-soft);margin:0 0 18px;font-size:1.02rem}
h2.loc{
  font-size:1.12rem; margin:26px 0 8px; color:var(--crust-dark);
  display:flex; align-items:center; gap:8px;
}
h2.loc::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(138,83,34,.4),transparent)}

p{margin:0 0 13px; line-height:1.66; font-size:1.045rem}
p.whisper{font-style:italic; color:var(--ink-soft)}
p em{color:var(--crust-dark)}
.scene-fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

blockquote.said{
  margin:0 0 14px; padding:2px 0 2px 16px;
  border-left:3px solid var(--gold);
  font-style:italic; color:#4b3222;
}
blockquote.said .who{
  display:block; font-style:normal; font-family:var(--sans);
  font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--crust-dark); margin-bottom:2px;
}

/* ---------------- choices ---------------- */
.choices{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.choice{
  font-family:var(--serif); font-size:1rem; text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.18));
  border:1px solid rgba(138,83,34,.45);
  border-left:5px solid var(--crust);
  color:var(--ink);
  padding:11px 14px 11px 13px; border-radius:9px; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s, background .12s;
  box-shadow:0 2px 0 rgba(138,83,34,.14);
  line-height:1.45;
}
.choice:hover:not(:disabled){
  transform:translateX(4px);
  border-left-color:var(--apple);
  background:linear-gradient(180deg,rgba(255,247,228,.95),rgba(255,236,205,.6));
  box-shadow:0 4px 12px -4px var(--shadow);
}
.choice:active:not(:disabled){transform:translateX(2px)}
.choice:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.choice .tag{
  font-family:var(--sans); font-size:.66rem; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--apple-dark);
  background:rgba(179,53,43,.12); border:1px solid rgba(179,53,43,.3);
  padding:2px 7px; border-radius:20px; margin-right:8px; white-space:nowrap;
  display:inline-block; vertical-align:1px;
}
.choice .tag.good{color:var(--leaf-dark);background:rgba(95,122,58,.14);border-color:rgba(95,122,58,.34)}
.choice .tag.gray{color:var(--ink-soft);background:rgba(107,75,52,.12);border-color:rgba(107,75,52,.3)}
.choice small{display:block;color:var(--ink-soft);font-size:.86rem;margin-top:3px;font-style:italic}
.choice.locked{opacity:.5;cursor:not-allowed;border-left-color:#a08b72}
.choice.primary{border-left-color:var(--apple);background:linear-gradient(180deg,rgba(255,244,224,.9),rgba(255,226,196,.55));font-weight:600}

/* ---------------- creator ---------------- */
.step-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pips{display:flex;gap:5px;margin-left:auto}
.pip{width:9px;height:9px;border-radius:50%;background:rgba(138,83,34,.25)}
.pip.on{background:var(--apple);box-shadow:0 0 0 3px rgba(179,53,43,.16)}

.grid{display:grid;gap:11px;margin-top:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.2));
  border:1px solid rgba(138,83,34,.4); border-radius:10px; padding:12px 13px;
  cursor:pointer; text-align:left; font-family:var(--serif); color:var(--ink);
  transition:transform .12s, box-shadow .12s, border-color .12s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px var(--shadow)}
.card.sel{border-color:var(--apple);box-shadow:0 0 0 2px var(--apple), 0 8px 18px -10px var(--shadow);background:linear-gradient(180deg,rgba(255,246,229,.95),rgba(255,228,199,.5))}
.card .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.03rem;color:var(--apple-dark)}
.card .ttl .ico{font-size:1.25rem;line-height:1}
.card .meta{font-family:var(--sans);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crust-dark);margin-top:3px}
.card .desc{font-size:.9rem;margin-top:6px;line-height:1.5;color:#4b3222}
.card .mech{font-size:.85rem;margin-top:7px;line-height:1.45;color:var(--leaf-dark);font-style:italic}
.card.locked{opacity:.45;cursor:not-allowed}

.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(138,83,34,.35);cursor:pointer;padding:0;transition:transform .1s}
.sw:hover{transform:scale(1.12)}
.sw.sel{box-shadow:0 0 0 3px var(--parchment),0 0 0 5px var(--apple);transform:scale(1.08)}

.field{margin-top:14px}
.field label{display:block;font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--crust-dark);margin-bottom:5px}
.field input[type=text]{
  width:100%;font-family:var(--serif);font-size:1.1rem;color:var(--ink);
  background:rgba(255,255,255,.55);border:1px solid rgba(138,83,34,.45);
  border-radius:8px;padding:10px 12px;
}
.field input[type=text]:focus{outline:3px solid var(--gold);outline-offset:1px}

.nav{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.btn{
  font-family:var(--sans);font-weight:700;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--apple),var(--apple-dark));color:#fff8ec;
  border:1px solid var(--apple-dark);border-radius:8px;padding:11px 20px;cursor:pointer;
  box-shadow:0 3px 0 rgba(125,31,24,.5), 0 10px 18px -10px var(--shadow);
  transition:transform .1s, box-shadow .1s, filter .1s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 0 rgba(125,31,24,.5),0 14px 22px -12px var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(125,31,24,.5)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(.5)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.25));color:var(--ink);border-color:rgba(138,83,34,.5);box-shadow:0 2px 0 rgba(138,83,34,.16)}
.btn.small{padding:8px 14px;font-size:.72rem}
.hint{font-size:.86rem;color:var(--ink-soft);font-style:italic}

/* ability scores */
.ability-row{
  display:grid;grid-template-columns:64px 1fr 42px;gap:10px;align-items:center;
  padding:7px 0;border-bottom:1px dashed rgba(138,83,34,.25);
}
.ability-row .ab{font-family:var(--sans);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crust-dark)}
.ability-row .ab small{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:.7rem;color:var(--ink-soft)}
.slot-btns{display:flex;gap:6px;flex-wrap:wrap}
.slot{
  font-family:var(--sans);font-weight:700;font-size:.95rem;
  min-width:40px;padding:6px 9px;border-radius:7px;cursor:pointer;
  background:rgba(255,255,255,.6);border:1px solid rgba(138,83,34,.45);color:var(--ink);
}
.slot.sel{background:var(--leaf);border-color:var(--leaf-dark);color:#fff8ec}
.slot:hover{border-color:var(--apple)}
.mod{
  font-family:var(--sans);font-weight:700;font-size:1rem;text-align:center;color:var(--leaf-dark);
  background:rgba(95,122,58,.12);border-radius:7px;padding:6px 0;border:1px solid rgba(95,122,58,.3);
}
.pool{font-family:var(--sans);font-size:.82rem;color:var(--ink-soft)}
.pool b{color:var(--apple-dark)}

/* ---------------- dice ---------------- */
.dice-box{
  margin:18px 0 6px;padding:16px 18px;border-radius:12px;
  background:linear-gradient(180deg,rgba(95,122,58,.14),rgba(95,122,58,.05));
  border:1px solid rgba(95,122,58,.4);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.dice-box.fail{background:linear-gradient(180deg,rgba(179,53,43,.14),rgba(179,53,43,.05));border-color:rgba(179,53,43,.4)}
.d20{width:74px;height:74px;flex:none}
.d20.roll{animation:spin .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{0%{transform:rotate(0) scale(.6);opacity:.3}60%{transform:rotate(320deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
.dice-num{
  font-family:var(--sans);font-size:1.5rem;font-weight:800;color:var(--leaf-dark);line-height:1;
}
.dice-box.fail .dice-num{color:var(--apple-dark)}
.dice-math{font-family:var(--sans);font-size:.82rem;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.dice-math b{color:var(--ink)}
.dice-verdict{font-size:1.12rem;font-weight:700;margin-top:4px;color:var(--leaf-dark)}
.dice-box.fail .dice-verdict{color:var(--apple-dark)}

.log{
  background:rgba(28,17,10,.86);border:1px solid rgba(217,164,65,.35);border-radius:12px;
  color:#e9d9b8;font-family:var(--sans);font-size:.8rem;overflow:hidden;
  box-shadow:0 14px 30px -18px rgba(0,0,0,.7);
}
.log-head{
  display:flex;align-items:center;justify-content:space-between;padding:9px 14px;
  background:rgba(217,164,65,.14);border-bottom:1px solid rgba(217,164,65,.25);
  letter-spacing:.14em;text-transform:uppercase;font-size:.68rem;font-weight:700;color:#e8c887;
}
.mini-btn{
  font-family:var(--sans);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid rgba(217,164,65,.5);color:#e8c887;
  border-radius:20px;padding:3px 10px;cursor:pointer;
}
.mini-btn:hover{background:rgba(217,164,65,.2)}
.log-body{max-height:190px;overflow-y:auto;padding:9px 14px;display:flex;flex-direction:column;gap:5px}
.log-line{border-bottom:1px dotted rgba(232,200,135,.16);padding-bottom:5px}
.log-line .r{font-weight:800;color:#ffd98a}
.log-line .ok{color:#a9d17a}
.log-line .bad{color:#f09084}

/* ---------------- character sheet ---------------- */
.sheet{
  position:sticky;top:22px;
  background:linear-gradient(170deg,var(--parchment),var(--parchment-3));
  border:1px solid rgba(138,83,34,.45);border-radius:14px;
  box-shadow:0 22px 46px -20px var(--shadow), inset 0 0 0 6px rgba(255,255,255,.2);
  padding:18px 18px 20px;max-height:calc(100dvh - 32px);overflow-y:auto;
}
.sheet h3{
  font-family:var(--sans);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--crust-dark);margin:16px 0 7px;display:flex;align-items:center;gap:7px;
}
.sheet h3:first-child{margin-top:0}
.sheet h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(138,83,34,.4),transparent)}
.pc-name{font-size:1.32rem;line-height:1.2;color:var(--apple-dark);margin:0;font-weight:700}
.pc-sub{font-family:var(--sans);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}

.hpbar{height:15px;border-radius:20px;background:rgba(138,83,34,.2);overflow:hidden;border:1px solid rgba(138,83,34,.35);margin-top:6px}
.hpfill{height:100%;background:linear-gradient(90deg,var(--apple),var(--gold));transition:width .5s ease}
.hp-num{font-family:var(--sans);font-size:.78rem;color:var(--ink-soft);margin-top:4px;text-align:right}

.abil-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ab-box{
  text-align:center;background:rgba(255,255,255,.5);border:1px solid rgba(138,83,34,.32);
  border-radius:8px;padding:6px 2px;
}
.ab-box .n{font-family:var(--sans);font-size:.6rem;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase}
.ab-box .s{font-family:var(--sans);font-weight:800;font-size:1.05rem;color:var(--ink);line-height:1.2}
.ab-box .m{font-family:var(--sans);font-size:.72rem;color:var(--leaf-dark);font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:var(--sans);font-size:.7rem;background:rgba(95,122,58,.14);
  border:1px solid rgba(95,122,58,.4);color:var(--leaf-dark);
  border-radius:20px;padding:3px 9px;
}
.chip.item{background:rgba(217,164,65,.16);border-color:rgba(180,132,45,.5);color:#7a5614}
.chip.clue{background:rgba(179,53,43,.12);border-color:rgba(179,53,43,.35);color:var(--apple-dark)}
.chip .pb{opacity:.65;font-weight:700}
.sheet .traits{font-size:.86rem;line-height:1.5;color:#4b3222;margin:0 0 6px}
.empty{font-family:var(--sans);font-size:.76rem;color:var(--ink-soft);font-style:italic}

/* ending gallery */
.gallery{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}
.gal{
  border:1px solid rgba(138,83,34,.4);border-radius:10px;padding:11px 12px;
  background:rgba(255,255,255,.45);font-size:.9rem;line-height:1.45;
}
.gal.locked{opacity:.55;border-style:dashed}
.gal .gt{font-weight:700;color:var(--apple-dark);display:block;margin-bottom:3px;font-size:.98rem}
.gal .gs{font-family:var(--sans);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crust-dark)}

/* misc */
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(138,83,34,.45),transparent);margin:20px 0}
.banner{
  font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:#fff8ec;background:linear-gradient(90deg,var(--leaf-dark),var(--leaf));
  border-radius:20px;padding:5px 13px;display:inline-block;margin-bottom:12px;
}
.banner.warn{background:linear-gradient(90deg,var(--apple-dark),var(--apple))}
.banner.gold{background:linear-gradient(90deg,#8a5322,var(--gold));color:#3a2418}
.stars{font-size:1.5rem;letter-spacing:3px;color:var(--gold);text-shadow:0 1px 0 rgba(138,83,34,.3)}
.ending-title{font-size:clamp(1.5rem,4vw,2.1rem);color:var(--apple-dark);margin:4px 0 8px;line-height:1.15}

.sheet-toggle{
  display:none;position:fixed;right:14px;bottom:14px;z-index:20;
  width:52px;height:52px;border-radius:50%;font-size:1.4rem;cursor:pointer;
  background:linear-gradient(180deg,var(--apple),var(--apple-dark));color:#fff8ec;
  border:2px solid rgba(255,248,236,.5);box-shadow:0 8px 20px -8px rgba(0,0,0,.6);
}

/* combat */
.combat{
  margin:16px 0;padding:14px 16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(179,53,43,.12),rgba(179,53,43,.03));
  border:1px solid rgba(179,53,43,.4);
}
.combat h4{margin:0 0 8px;font-family:var(--sans);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--apple-dark)}
.cbt-row{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--sans);font-size:.82rem}
.cbt{flex:1;min-width:150px;background:rgba(255,255,255,.45);border-radius:9px;padding:9px 11px;border:1px solid rgba(138,83,34,.3)}
.cbt .nm{font-weight:700;color:var(--ink)}
.cbt .st{color:var(--ink-soft);margin-top:3px}

@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);padding-bottom:16px}
  .sheet{position:fixed;inset:auto 10px 74px 10px;top:auto;max-height:62vh;z-index:15;display:none}
  .sheet.open{display:block}
  .sheet-toggle{display:block}
  .story{padding:22px 18px}
}

/* ---------------- cloud sync pill ---------------- */
.cloud-status{
  font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;justify-content:center;
  padding:6px 12px;border-radius:20px;margin-bottom:10px;
  border:1px solid rgba(138,83,34,.3);background:rgba(255,255,255,.4);color:var(--ink-soft);
}
.cloud-status .dot{font-size:.8rem;line-height:1}
.cloud-status.ok{background:rgba(95,122,58,.16);border-color:rgba(95,122,58,.45);color:var(--leaf-dark)}
.cloud-status.bad{background:rgba(179,53,43,.13);border-color:rgba(179,53,43,.4);color:var(--apple-dark)}
.cloud-status.idle{opacity:.75}
@media (max-width:900px){ .cloud-status{position:static;margin:0 0 10px} }

</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%A7%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <aside id="sheet" class="sheet" aria-label="Character sheet">
    <div class="sheet-inner" id="sheetInner"></div>
  </aside>

  <main id="main">
    <div class="story-frame">
      <div id="story" class="story"></div>
    </div>

<script>
/* ===== js/sync.js ===== */
/* =========================================================
   sync.js — Firebase Realtime Database mirror.

   The game never depends on this file. localStorage stays the
   source of truth; Firebase is a mirror that also lets a second
   device watch the run live. If Firebase is missing, misconfigured
   or unreachable, every call here is a silent no-op.

   Schema (built to hold more campaigns later):

     players/{playerId}/
       profile/            { name, createdAt, lastSeenAt }
       campaigns/{campaignId}/
         progress/         current save, mirrors localStorage
         character/        who she built
         endings/{id}/     { unlockedAt, runId }
         runs/{runId}/     one row per completed playthrough
         feed/{pushId}/    live dice rolls + choices, capped
   ========================================================= */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.DNDSync = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const STATE = {
    configured: false,
    online: false,
    error: null,
    db: null,
    playerId: null,
    campaignId: null,
    feedLimit: 200,
    runId: null,
    runStartedAt: null,
    feedWrites: 0,
    listeners: []
  };

  /* ---------- status reporting (the little pill in the corner) ---------- */
  function emit() {
    const s = status();
    STATE.listeners.forEach(fn => { try { fn(s); } catch (e) { /* ignore */ } });
  }
  function onStatus(fn) {
    STATE.listeners.push(fn);
    fn(status());
    return () => { STATE.listeners = STATE.listeners.filter(f => f !== fn); };
  }
  function status() {
    if (!STATE.configured) return { state: 'off', label: 'Cloud off', detail: 'No Firebase config' };
    if (STATE.error) return { state: 'error', label: 'Cloud error', detail: STATE.error };
    return STATE.online
      ? { state: 'online', label: 'Cloud synced', detail: `players/${STATE.playerId}/campaigns/${STATE.campaignId}` }
      : { state: 'connecting', label: 'Connecting…', detail: '' };
  }
  const isOn = () => STATE.configured && !STATE.error;

  /* ---------- RTDB refuses undefined and some key characters ---------- */
  function clean(v, depth = 0) {
    if (depth > 8) return null;
    if (v === undefined || typeof v === 'function') return null;
    if (v === null) return null;
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    if (typeof v !== 'object') return v;
    if (Array.isArray(v)) {
      const out = v.map(x => clean(x, depth + 1)).filter(x => x !== null);
      return out.length ? out : null;
    }
    const out = {};
    let any = false;
    Object.keys(v).forEach(k => {
      const key = k.replace(/[.#$\[\]\/]/g, '_');
      const val = clean(v[k], depth + 1);
      if (val !== null) { out[key] = val; any = true; }
    });
    return any ? out : null;
  }

  const base = () => `players/${STATE.playerId}/campaigns/${STATE.campaignId}`;
  const ref = p => STATE.db.ref(p);
  const TS = () => (STATE.db.app && STATE.db.app.firebase && STATE.db.app.firebase.database
    ? STATE.db.app.firebase.database.ServerValue.TIMESTAMP
    : Date.now());

  /* Swallow write failures — the game must never break because of the cloud. */
  function write(path, value) {
    if (!isOn()) return Promise.resolve(false);
    const c = clean(value);
    if (c === null) return Promise.resolve(false);
    try {
      return ref(path).set(c).then(() => true).catch(e => { STATE.error = String(e.message || e); emit(); return false; });
    } catch (e) { STATE.error = String(e.message || e); emit(); return Promise.resolve(false); }
  }
  /* Merge-write: unlike set(), update() does not delete sibling children,
     so progress and progress/scene can be written independently. */
  function merge(path, value) {
    if (!isOn()) return Promise.resolve(false);
    const c = clean(value);
    if (c === null) return Promise.resolve(false);
    try {
      return ref(path).update(c).then(() => true).catch(e => { STATE.error = String(e.message || e); emit(); return false; });
    } catch (e) { STATE.error = String(e.message || e); emit(); return Promise.resolve(false); }
  }

  /* =========================================================
     init — safe to call with anything. Never throws.
     ========================================================= */
  function init(opts) {
    const o = opts || {};
    const cfg = o.config || (typeof window !== 'undefined' && window.FIREBASE_CONFIG) || null;
    const firebase = o.firebase || (typeof window !== 'undefined' && window.firebase) || null;

    STATE.playerId = o.playerId || (typeof window !== 'undefined' && window.PLAYER_ID) || 'her';
    STATE.campaignId = o.campaignId || (typeof window !== 'undefined' && window.CAMPAIGN_ID) || 'apple-pie';
    STATE.feedLimit = o.feedLimit || (typeof window !== 'undefined' && window.FEED_LIMIT) || 200;

    if (!cfg || !firebase || !cfg.apiKey || /PASTE_ME/.test(String(cfg.apiKey)) || /PASTE_ME/.test(String(cfg.databaseURL || ''))) {
      STATE.configured = false;
      emit();
      return Promise.resolve(status());
    }
    if (!firebase.database) {
      STATE.configured = false;
      STATE.error = 'firebase-database-compat.js did not load';
      emit();
      return Promise.resolve(status());
    }

    try {
      const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
      STATE.db = o.database || firebase.database(app);
    } catch (e) {
      STATE.configured = false;
      STATE.error = String(e.message || e);
      emit();
      return Promise.resolve(status());
    }

    STATE.configured = true;
    STATE.error = null;
    STATE.feedWrites = 0;

    // .info/connected is the canonical connection flag
    try {
      ref('.info/connected').on('value', snap => {
        STATE.online = snap.val() === true;
        emit();
      });
    } catch (e) { /* offline is fine */ }

    // Read-only mode is for the watch page: it must NEVER write game state,
    // or simply opening it would stamp over her save.
    if (o.watchOnly) return Promise.resolve(status());

    STATE.runId = 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    STATE.runStartedAt = Date.now();

    return write(`players/${STATE.playerId}/profile`, { lastSeenAt: Date.now() })
      .then(() => status());
  }

  /* Called by the game (never the watch page) when a fresh run begins.
     Merges, so it cannot clobber anything a restore wrote. */
  function startRun() {
    if (!isOn()) return Promise.resolve(false);
    STATE.runId = 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    STATE.runStartedAt = Date.now();
    return merge(base() + '/progress', { runId: STATE.runId, startedAt: STATE.runStartedAt });
  }

  /* =========================================================
     game -> cloud
     ========================================================= */
  function saveProgress(snap) {
    if (!isOn()) return Promise.resolve(false);
    // merge so we never clobber progress/scene written by saveStoryPosition
    return merge(base() + '/progress', Object.assign({}, snap, { updatedAt: Date.now() }));
  }

  function saveCharacter(pc, level) {
    if (!isOn()) return Promise.resolve(false);
    return write(base() + '/character', {
      name: pc.name, pronouns: pc.pronouns,
      species: pc.speciesName, class: pc.className, background: pc.backgroundName,
      level: level, hp: pc.hp, maxHp: pc.maxHp, ac: pc.ac,
      abilities: pc.abilities, skills: pc.skills, expertise: pc.expertise,
      weapon: pc.weapon, damage: pc.damage,
      look: {
        hairStyle: pc.hairStyle, hair: pc.hairColorName, eyes: pc.eyeColorName,
        skin: pc.skinName, hairHex: pc.hairColorHex, eyeHex: pc.eyeColorHex, skinHex: pc.skinHex,
        mark: pc.mark, outfit: pc.outfit, trinket: pc.trinket, height: pc.height
      },
      updatedAt: Date.now()
    });
  }

  function saveStoryPosition(nodeId, chapter, title) {
    if (!isOn()) return Promise.resolve(false);
    return write(base() + '/progress/scene', { node: nodeId, chapter: chapter || '', title: title || '', at: Date.now() });
  }

  function unlockEnding(id, info) {
    if (!isOn()) return Promise.resolve(false);
    return write(`${base()}/endings/${id}`, Object.assign({ unlockedAt: Date.now(), runId: STATE.runId }, info || {}));
  }

  function endRun(info) {
    if (!isOn()) return Promise.resolve(false);
    return write(`${base()}/runs/${STATE.runId}`, Object.assign({
      startedAt: STATE.runStartedAt,
      endedAt: Date.now()
    }, info || {}));
  }

  /* ---------- the live feed ---------- */
  function feed(kind, text, detail) {
    if (!isOn()) return Promise.resolve(false);
    const entry = clean({ ts: Date.now(), kind, text, detail: detail || null });
    if (!entry) return Promise.resolve(false);
    STATE.feedWrites++;
    let p;
    try { p = ref(base() + '/feed').push(entry).then(() => true); }
    catch (e) { STATE.error = String(e.message || e); emit(); return Promise.resolve(false); }
    // prune every 20 entries so the feed cannot grow forever
    if (STATE.feedWrites % 20 === 0) p = p.then(pruneFeed);
    return p.catch(e => { STATE.error = String(e.message || e); emit(); return false; });
  }

  function pruneFeed() {
    if (!isOn()) return Promise.resolve(false);
    const q = ref(base() + '/feed').orderByKey();
    return q.once('value').then(snap => {
      const keys = Object.keys(snap.val() || {});
      const excess = keys.length - STATE.feedLimit;
      if (excess <= 0) return true;
      const doomed = keys.slice(0, excess);
      const upd = {};
      doomed.forEach(k => { upd[k] = null; });
      return ref(base() + '/feed').update(upd).then(() => true);
    }).catch(() => false);
  }

  /* =========================================================
     cloud -> game  (restore a run started on another device)
     ========================================================= */
  function loadProgress() {
    if (!isOn()) return Promise.resolve(null);
    return ref(base() + '/progress').once('value')
      .then(snap => snap.val() || null)
      .catch(() => null);
  }
  function loadEndings() {
    if (!isOn()) return Promise.resolve([]);
    return ref(base() + '/endings').once('value')
      .then(snap => Object.keys(snap.val() || {}))
      .catch(() => []);
  }

  /* =========================================================
     watch page helpers
     ========================================================= */
  function watch(kind, cb) {
    if (!isOn()) return () => {};
    const path = kind === 'all' ? base() : `${base()}/${kind}`;
    const r = ref(path);
    const handler = snap => cb(snap.val(), snap.key);
    r.on('value', handler);
    return () => { try { r.off('value', handler); } catch (e) { /* ignore */ } };
  }

  function watchProfile(cb) {
    if (!isOn()) return () => {};
    const r = ref(`players/${STATE.playerId}/profile`);
    const handler = snap => cb(snap.val());
    r.on('value', handler);
    return () => { try { r.off('value', handler); } catch (e) { /* ignore */ } };
  }

  function watchCampaigns(cb) {
    if (!isOn()) return () => {};
    const r = ref(`players/${STATE.playerId}/campaigns`);
    const handler = snap => cb(Object.keys(snap.val() || {}));
    r.on('value', handler);
    return () => { try { r.off('value', handler); } catch (e) { /* ignore */ } };
  }

  function clearCloud() {
    if (!isOn()) return Promise.resolve(false);
    return ref(base()).remove().then(() => true).catch(() => false);
  }

  return {
    init, onStatus, status, isOn, startRun,
    saveProgress, saveCharacter, saveStoryPosition, unlockEnding, endRun,
    feed, pruneFeed, loadProgress, loadEndings,
    watch, watchProfile, watchCampaigns, clearCloud,
    clean,                      // exported for tests
    _state: STATE               // exported for tests
  };
});

</script>

      ? '<g data-part="notes" fill="#7d4b22" opacity=".75"><text x="8" y="48" font-size="15" font-family="serif">&#9834;</text><text x="100" y="60" font-size="11" font-family="serif">&#9835;</text></g>'
      : '';
    const halo = cl === 'cleric'
      ? '<ellipse data-part="halo" cx="60" cy="22" rx="21" ry="5.5" fill="none" stroke="#e0b64a" stroke-width="2.6" opacity=".7"/>'
      : '';

    /* --- marks --- */
    const marks = {
      freckles: '<g fill="#b4713f" opacity=".55"><circle cx="45" cy="66" r="1.3"/><circle cx="50" cy="69" r="1.3"/><circle cx="55" cy="66" r="1.3"/><circle cx="62" cy="69" r="1.3"/><circle cx="67" cy="66" r="1.3"/><circle cx="41" cy="70" r="1.2"/><circle cx="71" cy="70" r="1.2"/></g>',
      scar: '<path d="M66 58 q4 6 1 13" stroke="#c98a6a" stroke-width="2" fill="none" stroke-linecap="round"/>',
      gap: '<rect x="55" y="79" width="4" height="4" fill="#f6ead2"/>',
      tattoo: '<g stroke="#b3352b" stroke-width="1.4" fill="none" opacity=".8"><circle cx="24" cy="86" r="4"/><path d="M24 82 v-4 M20 86 h-3"/></g>',
      glasses: '<g stroke="#5c4630" stroke-width="2" fill="none"><circle cx="47" cy="60" r="9"/><circle cx="73" cy="60" r="9"/><path d="M56 60 h8"/></g>',
      none: ''
    };

    const brows = dwarf
      ? '<g data-part="brows" fill="' + hair + '"><path d="M37 49 q11 -7 20 -1 l-2 6 q-9 -4 -17 1 z"/><path d="M63 48 q11 -6 20 1 l-1 6 q-10 -5 -17 -1 z"/></g>'
      : '<g data-part="brows"><path d="M40 50 q7 -4 14 -1" stroke="' + hair + '" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".85"/><path d="M66 49 q7 -3 14 1" stroke="' + hair + '" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".85"/></g>';

    const face = dragon ? '' :
      '<path d="M58 64 q2 8 0 10" stroke="rgba(0,0,0,.18)" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '<path d="M50 80 q10 7 20 0" stroke="#8a4a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
      (fem ? '<ellipse cx="40" cy="72" rx="6" ry="3.6" fill="#d9736a" opacity=".28"/><ellipse cx="80" cy="72" rx="6" ry="3.6" fill="#d9736a" opacity=".28"/>' : '');

    /* halflings stay young-faced: bigger eyes, rounder head */
    const headRx = elf ? 30 : halfling ? 33 : 32;
    const eyeRx = halfling ? 5.8 : 5;
    const eyeP = halfling ? 3.5 : 3.1;
    const w = size || 96;

    return '<svg viewBox="0 0 120 130" width="' + w + '" height="' + (w * 130 / 120) + '" role="img" aria-label="character portrait">' +
      '<ellipse cx="60" cy="120" rx="42" ry="10" fill="rgba(138,83,34,.16)"/>' +
      '<g data-part="figure"' + scale + '>' +
        tail + (behind[cl] || '') +
        hairBack + braidStrand +
        torso + bodyDeco +
        hoodBack + (onBody[cl] || '') +
        ears + earring +
        '<ellipse cx="60" cy="62" rx="' + headRx + '" ry="36" fill="' + skin + '"/>' +
        snout +
        hairTop + curls + bunTop + hat + cap +
        '<ellipse cx="47" cy="60" rx="' + eyeRx + '" ry="' + (eyeRx + 0.6) + '" fill="#fff"/><ellipse cx="73" cy="60" rx="' + eyeRx + '" ry="' + (eyeRx + 0.6) + '" fill="#fff"/>' +
        '<circle cx="47.6" cy="60.6" r="' + eyeP + '" fill="' + eyes + '"/><circle cx="73.6" cy="60.6" r="' + eyeP + '" fill="' + eyes + '"/>' +
        '<circle cx="48.6" cy="59.4" r="1.1" fill="#fff"/><circle cx="74.6" cy="59.4" r="1.1" fill="#fff"/>' +
        brows + face + fangs + beard + beardRings + stubble +
        (marks[mark] || '') +
        horns + crest + halo + notes +
      '</g></svg>';
  }

  return Object.freeze({
    STANDARD_ARRAY, ABILITIES, SKILLS, SKILL_BY_KEY, SPECIES, CLASSES, BACKGROUNDS,
    HAIR_STYLES, HAIR_COLORS, EYE_COLORS, SKIN_TONES, MARKS, OUTFITS, TRINKETS, HEIGHTS, SPECIES_DEFAULT_SKIN,
    ENEMIES, INGREDIENTS, ENDINGS, avatarSVG
  });
});

</script>
<script>
/* ===== js/engine.js ===== */
/* =========================================================
   engine.js — the dice, the math, the character sheet.
   Real D&D 5e rules: d20 + ability mod + proficiency vs a DC.
   ========================================================= */
(function (root, factory) {
  const D = (typeof module === 'object' && module.exports) ? require('./data.js') : root.DNDData;
  if (typeof module === 'object' && module.exports) module.exports = factory(D);
  else root.DNDEngine = factory(D);
})(typeof self !== 'undefined' ? self : this, function (D) {
  'use strict';

  /* ---------------- dice ---------------- */
  function d(n, sides = 6) { return Math.floor(Math.random() * sides) + 1; }
  function d20() { return d(1, 20); }
  function parseDice(str) {
    // "1d8+2" -> [1,8,2]
    const m = String(str).match(/^(\d*)d(\d+)([+-]\d+)?$/i);
    if (!m) return [1, 6, 0];
    return [parseInt(m[1] || '1', 10), parseInt(m[2], 10), parseInt(m[3] || '0', 10)];
  }
  function rollDice(str) {
    const [n, sides, flat] = parseDice(str);
    let total = flat, parts = [];
    for (let i = 0; i < n; i++) { const v = d(1, sides); parts.push(v); total += v; }
    return { total, parts, expr: str };
  }

  /* ---------------- state ---------------- */
  function newState() {
    return {
      phase: 'title',
      pc: null,
      level: 1,
      flags: {},          // story booleans
      clues: [],          // clue ids
      items: [],          // item ids
      ingredients: {},    // id -> quality 0..2
      used: {},           // one-use resources spent
      rolls: [],          // dice log
      node: null,
      seen: [],           // visited node ids
      endings: [],        // unlocked ending ids (persisted)
      combat: null,
      stats: { checks: 0, passed: 0, crits: 0, fumbles: 0 }
    };
  }

  const ABILITY_KEYS = D.ABILITIES.map(a => a.key);
  const shortOf = key => (D.ABILITIES.find(a => a.key === key) || {}).short || key.toUpperCase();
  const skillDef = key => D.SKILL_BY_KEY[key] || null;
  const skillName = key => (skillDef(key) || { name: key }).name;
  const speciesDef = id => D.SPECIES.find(s => s.id === id);
  const classDef = id => D.CLASSES.find(c => c.id === id);
  const backgroundDef = id => D.BACKGROUNDS.find(b => b.id === id);
  const markDef = id => D.MARKS.find(m => m.id === id);
  const outfitDef = id => D.OUTFITS.find(m => m.id === id);

  /* ---------------- modifiers ---------------- */
  const mod = score => Math.floor((score - 10) / 2);
  const signed = n => (n >= 0 ? '+' + n : '' + n);

  function profBonus(state) {
    return 2 + Math.floor((state.level - 1) / 4);
  }

  function hasTrait(state, id) {
    const sp = speciesDef(state.pc.species);
    return !!sp && sp.traits.some(t => t.id === id);
  }
  function hasFeature(state, id) {
    const cl = classDef(state.pc.class);
    if (!cl) return false;
    if (cl.features.some(f => f.id === id)) return true;
    return !!cl.level2 && cl.level2.id === id && state.level >= 2;
  }
  function isProficient(state, skillKey) {
    return state.pc.skills.includes(skillKey);
  }
  function isExpert(state, skillKey) {
    return state.pc.expertise === skillKey;
  }
  function spent(state, id) { return !!state.used[id]; }
  function spend(state, id) { state.used[id] = true; }

  /**
   * Flat modifier for an ability or skill check.
   * opts: { skill, bonus:[{id,label,amount}], context:{} }
   */
  function modifierFor(state, opts = {}) {
    const skill = opts.skill ? skillDef(opts.skill) : null;
    const ability = skill ? skill.ability : (opts.ability || 'str');
    let total = mod(state.pc.abilities[ability]);
    const parts = [{ label: shortOf(ability), amount: mod(state.pc.abilities[ability]) }];

    if (skill) {
      const pb = profBonus(state);
      if (isExpert(state, skill.key)) {
        total += pb * 2; parts.push({ label: 'Proficiency (Expertise)', amount: pb * 2 });
      } else if (isProficient(state, skill.key)) {
        total += pb; parts.push({ label: 'Proficiency', amount: pb });
      } else if (hasFeature(state, 'jack')) {
        const j = Math.floor(pb / 2);
        if (j > 0) { total += j; parts.push({ label: 'Jack of All Trades', amount: j }); }
      }
    }

    // class / species / background riders
    if (skill && skill.key === 'history' && hasTrait(state, 'stonecunning') && opts.context && opts.context.stonework) {
      total += 2; parts.push({ label: 'Stone Cunning', amount: 2 });
    }
    if (skill && skill.key === 'survival' && hasFeature(state, 'natural') && opts.context && opts.context.wilds) {
      total += 2; parts.push({ label: 'Natural Explorer', amount: 2 });
    }
    if (skill && (skill.ability === 'cha') && state.pc.background === 'artisan' && opts.context && opts.context.merchant) {
      total += 1; parts.push({ label: 'Guild Artisan', amount: 1 });
    }
    if (skill && skill.key === 'insight' && state.pc.background === 'acolyte') {
      total += 1; parts.push({ label: 'Shelter of the Faithful', amount: 1 });
    }
    if (skill && ['intimidation', 'persuasion'].includes(skill.key) && state.pc.background === 'soldier' && opts.context && opts.context.official) {
      total += 1; parts.push({ label: 'Military Rank', amount: 1 });
    }
    if (skill && skill.key === 'persuasion' && state.pc.background === 'folkhero' && opts.context && opts.context.villager) {
      total += 1; parts.push({ label: 'Rustic Hospitality', amount: 1 });
    }
    if (skill && ['nature', 'animal'].includes(skill.key) && hasTrait(state, 'minorillusion') && opts.context && opts.context.beasts) {
      total += 1; parts.push({ label: 'Thaumaturgy', amount: 1 });
    }

    // mark / outfit / trinket riders
    const mark = markDef(state.pc.mark);
    const outfit = outfitDef(state.pc.outfit);
    const ctx = opts.context || {};
    if (mark && skill) {
      const rules = {
        freckles: s => s.key === 'persuasion' && (ctx.cook || ctx.grandmother),
        scar: () => !!ctx.fire,
        gap: s => ['deception', 'stealth'].includes(s.key),
        tattoo: s => ['nature', 'animal'].includes(s.key),
        glasses: s => ['perception', 'history'].includes(s.key),
        none: s => s.key === 'stealth'
      };
      if (rules[mark.id] && rules[mark.id](skill)) { total += 1; parts.push({ label: mark.name, amount: 1 }); }
    }
    if (outfit && skill) {
      const rules = {
        cloak: s => s.key === 'stealth' && ctx.hood,
        apron: () => !!ctx.kitchen,
        fine: s => ['persuasion', 'deception'].includes(s.key) && ctx.important,
        patched: s => ['acrobatics', 'athletics', 'survival'].includes(s.key)
      };
      if (rules[outfit.id] && rules[outfit.id](skill)) { total += 1; parts.push({ label: outfit.name, amount: 1 }); }
    }

    (opts.bonus || []).forEach(b => { total += b.amount; parts.push({ label: b.label, amount: b.amount }); });

    return { total, parts, ability, skill: skill ? skill.key : null };
  }

  /** Advantage resolution. Returns 'adv' | 'dis' | null */
  function advantageFor(state, opts = {}) {
    if (opts.advantage && opts.disadvantage) return null;   // they cancel
    if (opts.advantage) return 'adv';
    if (opts.disadvantage) return 'dis';
    return null;
  }

  /* ---------------- the roll ---------------- */
  /**
   * roll(state, { skill, ability, dc, advantage, disadvantage, bonus, context, label })
   * Returns { d20, die, mod, parts, total, dc, pass, crit, fumble, label, logText }
   */
  function roll(state, opts = {}) {
    const m = modifierFor(state, opts);
    let adv = advantageFor(state, opts);
    let die, second = null;

    if (adv === 'adv') {
      const a = d20(), b = d20();
      die = Math.max(a, b); second = { a, b, kept: 'high' };
    } else if (adv === 'dis') {
      const a = d20(), b = d20();
      die = Math.min(a, b); second = { a, b, kept: 'low' };
    } else {
      die = d20();
    }

    // Halfling Lucky: reroll a natural 1 once
    let lucky = false;
    if (die === 1 && hasTrait(state, 'lucky')) {
      die = d20(); lucky = true;
    }

    const total = die + m.total;
    const dc = opts.dc == null ? null : opts.dc;
    const crit = die === 20;
    const fumble = die === 1;
    let pass;
    if (dc == null) pass = null;
    else if (crit) pass = true;
    else if (fumble) pass = false;
    else pass = total >= dc;

    const result = {
      d20: die, second, adv, lucky, mod: m.total, parts: m.parts, total, dc,
      pass, crit, fumble,
      label: opts.label || (opts.skill ? skillName(opts.skill) + ' check' : 'Roll'),
      skill: m.skill, ability: m.ability
    };
    result.logText = describeRoll(result);

    state.rolls.push(result);
    if (state.rolls.length > 200) state.rolls.shift();
    state.stats.checks++;
    if (dc != null) { if (pass) state.stats.passed++; }
    if (crit) state.stats.crits++;
    if (fumble) state.stats.fumbles++;
    return result;
  }

  function describeRoll(r) {
    const bits = [];
    bits.push(r.label);
    bits.push(`d20 = ${r.d20}${r.second ? ` (rolled ${r.second.a} & ${r.second.b}, kept ${r.second.kept})` : ''}${r.lucky ? ' — Lucky reroll!' : ''}`);
    bits.push(`modifier ${signed(r.mod)} [${r.parts.map(p => `${p.label} ${signed(p.amount)}`).join(', ')}]`);
    bits.push(`total ${r.total}`);
    if (r.dc != null) bits.push(`vs DC ${r.dc} → ${r.crit ? 'CRITICAL SUCCESS' : r.fumble ? 'CRITICAL FAILURE' : r.pass ? 'SUCCESS' : 'FAILURE'}`);
    return bits.join(' · ');
  }

  /* ---------------- combat ---------------- */
  function startCombat(state, enemyKey) {
    const e = D.ENEMIES[enemyKey];
    const pc = state.pc;
    state.combat = {
      key: enemyKey,
      enemy: { name: e.name, icon: e.icon, ac: e.ac, hp: e.hp, maxHp: e.hp, atk: e.atk, dmg: e.dmg, dmgType: e.dmgType, note: e.note },
      round: 1,
      log: [],
      over: false,
      won: false,
      fled: false,
      dodgeNext: false,
      sneakUsed: false,
      breathUsed: false,
      surgeUsed: false,
      markActive: false
    };
    combatLog(state, `⚔️ Combat begins: ${e.name} (AC ${e.ac}, ${e.hp} HP).`);
    return state.combat;
  }

  function combatLog(state, text) {
    if (!state.combat) return;
    state.combat.log.push(text);
    if (state.combat.log.length > 60) state.combat.log.shift();
  }

  function damageToPC(state, amount, type) {
    let amt = amount;
    let note = '';
    if (type === 'poison' && hasTrait(state, 'poisonres')) { amt = 0; note = ' (Dwarven Resilience — no poison damage)'; }
    else if (type === 'fire' && hasTrait(state, 'fireres')) { amt = Math.floor(amt / 2); note = ' (Fire Resistance — half damage)'; }
    state.pc.hp = Math.max(0, state.pc.hp - amt);
    combatLog(state, `💥 You take ${amt} ${type} damage${note}. HP ${state.pc.hp}/${state.pc.maxHp}.`);
    return amt;
  }

  function damageToEnemy(state, amount, label) {
    state.combat.enemy.hp = Math.max(0, state.combat.enemy.hp - amount);
    combatLog(state, `🗡️ ${label} — ${amount} damage. ${state.combat.enemy.name}: ${state.combat.enemy.hp}/${state.combat.enemy.maxHp} HP.`);
    return amount;
  }

  function enemyTurn(state) {
    const c = state.combat;
    const die = d20();
    const total = die + c.enemy.atk;
    const disadv = c.dodgeNext;
    c.dodgeNext = false;
    let hit = total >= state.pc.ac;
    if (disadv && die !== 20) {
      const die2 = d20();
      const total2 = die2 + c.enemy.atk;
      hit = Math.min(total, total2) >= state.pc.ac;
      combatLog(state, `🛡️ ${c.enemy.name} attacks (dodging: ${die} & ${die2}).`);
    } else {
      combatLog(state, `${c.enemy.name} attacks: d20 ${die} + ${c.enemy.atk} = ${total} vs your AC ${state.pc.ac}.`);
    }
    if (die === 1) { combatLog(state, `✨ It misses badly.`); return; }
    if (hit) damageToPC(state, rollDice(c.enemy.dmg).total, c.enemy.dmgType);
    else combatLog(state, `✨ It misses.`);
  }

  function checkCombatEnd(state) {
    const c = state.combat;
    if (!c || c.over) return;
    if (c.enemy.hp <= 0) { c.over = true; c.won = true; combatLog(state, `🏆 ${c.enemy.name} is defeated!`); }
    else if (state.pc.hp <= 0) { c.over = true; c.won = false; combatLog(state, `🌑 You fall...`); }
  }

  /** Player attacks. opts: { bonus:[], label, extraDamage, advantage } */
  function playerAttack(state, opts = {}) {
    const c = state.combat;
    const pc = state.pc;
    const atkAbility = pc.atkAbility;
    const bonus = [{ label: shortOf(atkAbility), amount: mod(pc.abilities[atkAbility]) },
                   { label: 'Proficiency', amount: profBonus(state) }];
    (opts.bonus || []).forEach(b => bonus.push(b));
    let atkTotal = bonus.reduce((s, b) => s + b.amount, 0);
    let adv = opts.advantage ? 'adv' : null;
    if (c.advantageNext) { adv = 'adv'; c.advantageNext = false; }

    let die;
    if (adv === 'adv') { const a = d20(), b = d20(); die = Math.max(a, b); }
    else die = d20();

    const total = die + atkTotal;
    const hit = die === 20 || (die !== 1 && total >= c.enemy.ac);
    combatLog(state, `${opts.label || 'You attack'}: d20 ${die} ${signed(atkTotal)} = ${total} vs AC ${c.enemy.ac}${adv ? ' (advantage)' : ''}.`);

    if (hit) {
      let dmg = rollDice(pc.damage.split(' ')[0]).total + mod(pc.abilities[pc.dmgAbility]);
      let detail = `${pc.weapon} (${pc.damage} ${signed(mod(pc.abilities[pc.dmgAbility]))})`;
      if (pc.sneak && !c.sneakUsed) {
        const s = rollDice(pc.sneak).total;
        dmg += s; c.sneakUsed = true;
        detail += ` + Sneak Attack ${s}`;
      }
      if (c.markActive) {
        const hm = rollDice('1d6').total; dmg += hm; detail += ` + Hunter's Mark ${hm}`;
      }
      if (opts.extraDamage) { dmg += opts.extraDamage; detail += ` + ${opts.extraLabel || 'bonus'} ${opts.extraDamage}`; }
      if (die === 20) { const crit = rollDice(pc.damage.split(' ')[0]).total; dmg += crit; detail += ` + CRIT ${crit}`; }
      dmg = Math.max(1, dmg);
      damageToEnemy(state, dmg, detail);
    } else {
      combatLog(state, `💨 Miss.`);
    }
    checkCombatEnd(state);
    return hit;
  }

  /* ---------------- character ---------------- */
  function finishCharacter(state, build) {
    const sp = speciesDef(build.species);
    const cl = classDef(build.class);
    const bg = backgroundDef(build.background);

    const abilities = {};
    ABILITY_KEYS.forEach(k => { abilities[k] = (build.assignment[k] || 8) + (sp.bonus[k] || 0); });

    const conMod = mod(abilities.con);
    const maxHp = cl.hitDie + conMod;

    const dexMod = mod(abilities.dex);
    let ac = cl.acBase + dexMod;
    if (cl.id === 'cleric') ac = cl.acBase;   // chain mail ignores Dexterity

    const pc = {
      name: build.name.trim() || 'Wren',
      pronouns: build.pronouns || 'she/her',
      height: build.height || 'Average',
      species: sp.id, speciesName: sp.name,
      class: cl.id, className: cl.name,
      background: bg.id, backgroundName: bg.name,
      hairStyle: build.hairStyle, hairColor: build.hairColor,
      eyeColor: build.eyeColor, skin: build.skin,
      mark: build.mark, outfit: build.outfit, trinket: build.trinket,
      abilities,
      hairColorName: (build.hairColor && build.hairColor.name) || '',
      hairColorHex: (build.hairColor && build.hairColor.hex) || '#6b3f21',
      eyeColorName: (build.eyeColor && build.eyeColor.name) || '',
      eyeColorHex: (build.eyeColor && build.eyeColor.hex) || '#8a6a34',
      skinName: (build.skin && build.skin.name) || '',
      skinHex: (build.skin && build.skin.hex) || '#eec7a6',
      // class picks + the two free skills your origin grants
      skills: [...new Set([...(build.skills || []), ...bg.skills])],
      expertise: build.expertise || null,
      hp: maxHp, maxHp, ac,
      atkAbility: cl.atkAbility, dmgAbility: cl.dmgAbility,
      weapon: cl.weapon, damage: cl.damage, sneak: cl.sneak || null,
      cantrips: cl.cantrips || [],
      equipment: [...cl.equipment, ...bg.gear.map(g => g.name)],
      spellSlots: cl.id === 'wizard' ? 2 : (cl.id === 'bard' ? 2 : 0)
    };
    state.pc = pc;
    state.level = 1;
    state.flags.pieScore = 0;
    return pc;
  }

  function levelUp(state) {
    if (state.level >= 2) return null;
    const cl = classDef(state.pc.class);
    const gained = d(1, cl.hitDie) + mod(state.pc.abilities.con);
    state.level = 2;
    state.pc.maxHp += Math.max(1, gained);
    state.pc.hp = state.pc.maxHp;
    return { hp: Math.max(1, gained), feature: cl.level2 };
  }

  /* ---------------- flags & tracking ---------------- */
  const setFlag = (state, k, v = true) => { state.flags[k] = v; };
  const flag = (state, k) => state.flags[k];
  const hasClue = (state, id) => state.clues.includes(id);
  function addClue(state, id) { if (!state.clues.includes(id)) { state.clues.push(id); return true; } return false; }
  function addItem(state, id) { if (!state.items.includes(id)) { state.items.push(id); return true; } return false; }
  const hasItem = (state, id) => state.items.includes(id);

  function setIngredient(state, id, quality) {
    state.ingredients[id] = Math.max(state.ingredients[id] || 0, quality);
  }
  function ingredientCount(state) { return Object.keys(state.ingredients).length; }

  /* ---------------- the pie ---------------- */
  /**
   * Pie quality 0-10: ingredient quality (0-6) + baking rolls (0-3) + help (0-1)
   */
  function pieQuality(state) {
    let q = 0;
    const quals = D.INGREDIENTS.map(i => state.ingredients[i.id] || 0);
    q += quals.reduce((a, b) => a + b, 0);            // 5 ingredients × max 2 = 10 → capped below
    q = Math.min(6, q);
    q += Math.min(3, state.flags.bakingScore || 0);
    if (state.flags.grammyHelp) q += 1;
    return Math.max(0, Math.min(10, q));
  }

  function resolveEnding(state) {
    const q = pieQuality(state);
    const allClues = state.clues.length >= 5;
    const recipe = state.flags.hasRecipe;
    const pip = state.flags.pipFriend;

    if (allClues && pip && recipe && q >= 8) return 'true';
    if (recipe && q >= 6) return 'heir';
    if (q >= 7) return 'champion';
    if (q >= 4) return 'humble';
    if (recipe) return 'recipe';
    return 'burnt';
  }

  /* ---------------- persistence (endings gallery) ---------------- */
  function loadUnlocked(store) {
    try {
      const raw = store.getItem('applePieEndings');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveUnlocked(store, list) {
    try { store.setItem('applePieEndings', JSON.stringify(list)); } catch (e) { /* private mode */ }
  }

  return {
    d, d20, rollDice, parseDice,
    newState, finishCharacter, levelUp,
    roll, describeRoll, modifierFor, advantageFor,
    mod, signed, profBonus, shortOf, skillName, skillDef,
    speciesDef, classDef, backgroundDef, markDef, outfitDef,
    hasTrait, hasFeature, isProficient, isExpert, spent, spend,
    startCombat, playerAttack, enemyTurn, combatLog, damageToPC, damageToEnemy, checkCombatEnd,
    setFlag, flag, addClue, hasClue, addItem, hasItem,
    setIngredient, ingredientCount, pieQuality, resolveEnding,
    loadUnlocked, saveUnlocked, ABILITY_KEYS
  };
});
